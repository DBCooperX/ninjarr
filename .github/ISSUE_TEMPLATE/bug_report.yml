name: Something broke
description: bootstrap.sh failed, or the stack came up wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations: {required: true}
  - type: textarea
    id: log
    attributes:
      label: Relevant lines from .ninjarr.log
      description: Redact API keys and passwords before pasting. Never paste ninjarr.env.
      render: shell
  - type: input
    id: os
    attributes: {label: OS, placeholder: "Debian 13 / Ubuntu 24.04 / ..."}
    validations: {required: true}
  - type: input
    id: docker
    attributes: {label: Docker version, placeholder: "docker version --format '{{.Server.Version}}'"}
  - type: dropdown
    id: where
    attributes:
      label: Where does it run
      options: [Proxmox VM made by create-vm.sh, Proxmox VM made by hand, Proxmox LXC, Other VM, Bare metal]
    validations: {required: true}
  - type: textarea
    id: doctor
    attributes:
      label: Output of `./bootstrap.sh doctor`
      description: Checks the whole chain. It contains no keys or passwords.
      render: shell
    validations: {required: true}
